<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
    <text x="20" y="90" class="n-letter" font-family="'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="76" font-weight="700">N</text>
    <text x="66" y="90" class="g-letter" font-family="'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="76" font-weight="700">G</text>
    <style>
        .g-letter { fill: #000; }
        .n-letter { fill: #d92b2b; }
        @media (prefers-color-scheme: dark) {
            .g-letter { fill: #FFF; }
        }
    </style>
</svg>
